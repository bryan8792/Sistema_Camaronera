{% extends 'base.html' %}

{% load static %}
{% load widget_tweaks %}

{% block head %}

    <link rel="stylesheet" href="{% static 'lib/datatables-1.10.20/css/dataTables.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'acciones/app_datatable/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'acciones/app_datatable/datatables/datatables.min.css' %}">
    <link rel="stylesheet" type="text/css"
          href="{% static 'acciones/app_datatable/datatables/DataTables-1.10.18/css/dataTables.bootstrap4.min.css' %}">

    <style>
        .filtros-container {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
        }

        .filtros-container label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
        }

        .filtros-container .form-control {
            border-radius: 4px;
            border: 1px solid #ced4da;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 10px;
            border: 2px solid #dee2e6;
            border-radius: 4px;
        }

        #tb_movimientos_producto {
            font-size: 12px;
            margin-bottom: 0;
            border-collapse: collapse;
        }

        #tb_movimientos_producto thead th {
            background-color: #FFFF00 !important;
            color: #000 !important;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            vertical-align: bottom;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            height: 250px;
            padding: 8px 4px;
            border: 1px solid #b8b800 !important;
            white-space: nowrap;
            min-width: 45px;
            max-width: 45px;
        }

        #tb_movimientos_producto thead th:first-child {
            writing-mode: horizontal-tb;
            transform: none;
            height: auto;
            background-color: #FFFF00 !important;
            min-width: 120px;
            max-width: 120px;
            vertical-align: middle;
            font-size: 12px;
            padding: 10px;
        }

        #tb_movimientos_producto tbody td {
            text-align: center;
            font-size: 12px;
            padding: 8px 5px;
            border: 1px solid #dee2e6;
            vertical-align: middle;
        }

        #tb_movimientos_producto tbody td:first-child {
            background-color: #FFFF00 !important;
            font-weight: 700;
            text-align: left;
            padding-left: 12px;
            border: 1px solid #b8b800 !important;
            min-width: 120px;
        }

        #tb_movimientos_producto tbody tr:hover td:not(:first-child) {
            background-color: #f5f5dc;
        }

        #tb_movimientos_producto tbody tr.total-row td {
            background-color: #FFA500 !important;
            font-weight: 700;
            color: #000;
            border: 1px solid #cc8400 !important;
            font-size: 12px;
        }

        #tb_movimientos_producto tbody tr.total-row td:first-child {
            background-color: #FFA500 !important;
            border: 1px solid #cc8400 !important;
        }

        .cell-with-value {
            background-color: #FFFACD !important;
            font-weight: 500;
        }

        .btn-filtrar {
            background-color: #3498DB;
            border-color: #3498DB;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
        }

        .btn-filtrar:hover {
            background-color: #2980B9;
            border-color: #2980B9;
            color: white;
        }

        .btn-exportar {
            background-color: #27AE60;
            border-color: #27AE60;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
        }

        .btn-exportar:hover {
            background-color: #219A52;
            border-color: #219A52;
            color: white;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            border-radius: 4px;
        }

        .card-header-custom {
            background-color: #3498DB;
            color: white;
            padding: 15px 20px;
        }

        .card-header-custom h4 {
            margin: 0;
            font-weight: 600;
        }
    </style>

{% endblock %}

{% block contenido %}

    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h4 class="m-0"><strong>{{ nombre }}</strong></h4>
                </div>
                <div class="col-sm-6 text-right">
                    <a href="{% url 'app_stock:listar_stock_psm' %}" class="btn btn-outline-secondary btn-sm">
                        <i class="fas fa-undo"></i> REGRESAR
                    </a>
                </div>
            </div>
        </div>
    </div>

    <section class="content">
        <div class="container-fluid">
            <div class="card shadow-sm">
                <div class="card-body">
                    <!-- Filtros -->
                    <div class="row filtros-container align-items-end">
                        <div class="col-md-3">
                            <label for="select_empresa">Empresa:</label>
                            <select id="select_empresa" class="form-control">
                                <option value="">Todas las Empresas</option>
                                <option value="PSM">PSM</option>
                                <option value="BIO">BIO</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="select_anio">Ano:</label>
                            <select id="select_anio" class="form-control">
                                <option value="">Todos los Anos</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="button" id="btn_filtrar" class="btn btn-filtrar btn-block">
                                <i class="fas fa-search"></i> Filtrar
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button type="button" id="btn_exportar" class="btn btn-exportar btn-block">
                                <i class="fas fa-file-excel"></i> Exportar Excel
                            </button>
                        </div>
                    </div>

                    <!-- Tabla -->
                    <div class="table-wrapper" style="position: relative;">
                        <div id="loading" class="loading-overlay" style="display: none;">
                            <div class="text-center">
                                <div class="spinner-border text-primary mb-2" role="status" style="width: 3rem; height: 3rem;">
                                    <span class="sr-only">Cargando...</span>
                                </div>
                                <p class="text-muted mb-0">Cargando datos...</p>
                            </div>
                        </div>
                        <table id="tb_movimientos_producto" class="table table-sm table-bordered">
                            <thead>
                                <tr id="header_row">
                                    <th>MES</th>
                                </tr>
                            </thead>
                            <tbody id="body_data">
                                <tr>
                                    <td class="text-center text-muted py-4" colspan="100">Seleccione los filtros y presione <strong>Filtrar</strong></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

{% endblock %}

{% block scripts %}

    <script src="{% static 'lib/moment-2.25.3/moment.js' %}"></script>
    <script type="text/javascript" src="{% static 'acciones/app_datatable/datatables/datatables.min.js' %}"></script>
    <script src="{% static 'acciones/app_datatable/datatables/Buttons-1.5.6/js/dataTables.buttons.min.js' %}"></script>
    <script src="{% static 'acciones/app_datatable/datatables/JSZip-2.5.0/jszip.min.js' %}"></script>
    <script src="{% static 'acciones/app_datatable/datatables/pdfmake-0.1.36/pdfmake.min.js' %}"></script>
    <script src="{% static 'acciones/app_datatable/datatables/pdfmake-0.1.36/vfs_fonts.js' %}"></script>
    <script src="{% static 'acciones/app_datatable/datatables/Buttons-1.5.6/js/buttons.html5.min.js' %}"></script>

    <script type="text/javascript" src="{% static 'acciones/app_kardex/movimientos_por_producto.js' %}"></script>

{% endblock %}
