{% extends 'base.html' %}
{% load static %}

{% block head %}
    <script src="{% static 'acciones/app_retencion/admin/js/list.js' %}"></script>
{% endblock %}

{% block contenido %}

    <section class="content">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Listado de <strong>Retenciones</strong></h3>
            </div>

            <div class="card-body">
                <table id="tblRetention" class="table table-striped table-bordered">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>NÚMERO</th>
                        <th>PROVEEDOR</th>
                        <th>FECHA</th>
                        <th>TOTAL</th>
                        <th>ESTADO</th>
                        <th>OPCIONES</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>

                <div class="mt-3">
                    <a href="{% url 'app_retencion:retention_create' %}"
                       class="btn btn-primary">
                        <i class="fas fa-plus"></i> Nueva Retención
                    </a>

                    <button class="btn btn-success" onclick="tblRetention.ajax.reload();">
                        <i class="fas fa-sync"></i> Actualizar
                    </button>
                </div>

            </div>
            {% comment %}<div class="card-footer">
                <div class="row">
                    <div class="col-lg-8 col-md-12">
                        <a href="{% url 'app_retencion:retention_create' %}"
                           class="btn btn-primary btn-flat">
                            <i class="fas fa-plus"></i> Nueva Retención
                        </a>

                        <button class="btn btn-success btn-flat" onclick="location.reload();">
                            <i class="fas fa-sync-alt"></i> Actualizar
                        </button>
                    </div>
                </div>
            </div>{% endcomment %}

        </div>
    </section>

{% endblock %}
