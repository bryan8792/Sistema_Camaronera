{% extends 'base.html' %}
{% block contenido %}

<form id="frmRetention" method="post">
    {% csrf_token %}

    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-file-invoice"></i> Crear Retención</h3>
        </div>

        <div class="card-body">

            <!-- Selección de Empresa, Proveedor y Recibo -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <label>Empresa</label>
                    <select name="company" class="form-control" required>
                        <option value="">-- Seleccionar empresa --</option>
                        {% for c in companies %}
                            <option value="{{ c.id }}">{{ c.nombre|default:"Sin nombre" }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Proveedor</label>
                    <select name="provider" class="form-control">
                        <option value="">-- Ninguno --</option>
                        {% for p in providers %}
                            <option value="{{ p.id }}">{{ p.razon_soc|default:"Sin proveedor" }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Recibo</label>
                    <select name="receipt" class="form-control" required>
                        <option value="">-- Seleccionar recibo --</option>
                        {% for r in receipts %}
                            <option value="{{ r.id }}">
                                {{ r.voucher_number_full }} | {{ r.empresa.nombre|default:"Sin empresa" }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-4 mt-3">
                    <label>Subtotal</label>
                    <input type="number" name="subtotal" class="form-control" value="0" step="0.01" readonly>
                </div>
            </div>

            <!-- Detalles de retención -->
            <hr>
            <table class="table table-bordered" id="tblRetention">
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Código</th>
                        <th>Número</th>
                        <th>COMROBANTE</th>
                        <th>%</th>
                        <th>Base</th>
                        <th>Valor</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <button type="button" class="btn btn-success mb-3" id="btnAdd">
                <i class="fas fa-plus"></i> Agregar
            </button>

            <!-- Contenedor para mostrar los links de descarga -->
            <div id="downloadLinks" class="mt-3"></div>

        </div>

        <div class="card-footer text-right">
            <button type="submit" class="btn btn-primary">
                Guardar Retención
            </button>
        </div>
    </div>
</form>

<script>
// Definir las opciones del campo COMP. PAGO CUOTA
const compPagoCuotaOptions = [
    ['OPCION_1', 'OPCIÓN 1'],
    ['OPCION_2', 'OPCIÓN 2'],
    ['OPCION_3', 'OPCIÓN 3'],
    ['OPCION_4', 'OPCIÓN 4'],
    ['OPCION_5', 'OPCIÓN 5'],
    ['OPCION_6', 'OPCIÓN 6'],
    ['OPCION_7', 'OPCIÓN 7'],
    ['OPCION_8', 'OPCIÓN 8'],
    ['OPCION_9', 'OPCIÓN 9'],
    ['OPCION_10', 'OPCIÓN 10'],
    ['OPCION_11', 'OPCIÓN 11'],
    ['COMP_PAGO_CUOTA', 'COMP. PAGO CUOTA'],
    ['OPCION_13', 'OPCIÓN 13'],
    ['OPCION_14', 'OPCIÓN 14'],
    ['OPCION_15', 'OPCIÓN 15']
];

// Función para generar las opciones del select
function generateCompPagoCuotaOptions() {
    let options = '';
    compPagoCuotaOptions.forEach(function(option) {
        options += `<option value="${option[0]}">${option[1]}</option>`;
    });
    return options;
}

$('#btnAdd').click(function () {
    $('#tblRetention tbody').append(`
        <tr>
            <td>
                <select class="form-control tax_type" name="tax_type[]">
                    <option value="IVA">IVA</option>
                    <option value="RENTA">RENTA</option>
                </select>
            </td>
            <td>
                <input class="form-control tax_code" name="tax_code[]">
            </td>
            <td>
                <input class="form-control numero_15_digitos"
                       name="numero_15_digitos[]"
                       type="number"
                       maxlength="15"
                       placeholder="Máx. 15 dígitos"
                       oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);">
            </td>
            <td>
                <select class="form-control comp_pago_cuota" name="comp_pago_cuota[]">
                    ${generateCompPagoCuotaOptions()}
                </select>
            </td>
            <td>
                <input class="form-control percentage"
                       name="percentage[]"
                       type="number"
                       step="0.01"
                       min="0"
                       max="100">
            </td>
            <td>
                <input class="form-control base"
                       name="base[]"
                       type="number"
                       value="0"
                       step="0.01"
                       min="0">
            </td>
            <td>
                <input class="form-control value"
                       name="value[]"
                       readonly>
            </td>
            <td>
                <button type="button" class="btn btn-danger btnRemove">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>
    `);
});

$(document).on('click', '.btnRemove', function () {
    $(this).closest('tr').remove();
    updateSubtotal();
});

$(document).on('input', '.base, .percentage', function () {
    let row = $(this).closest('tr');
    let base = parseFloat(row.find('.base').val()) || 0;
    let perc = parseFloat(row.find('.percentage').val()) || 0;
    row.find('.value').val((base * perc / 100).toFixed(2));
    updateSubtotal();
});

function updateSubtotal(){
    let subtotal = 0;
    $('#tblRetention tbody tr').each(function(){
        subtotal += parseFloat($(this).find('.value').val()) || 0;
    });
    $('input[name="subtotal"]').val(subtotal.toFixed(2));
}

// Validar número de 15 dígitos máximo
$(document).on('input', '.numero_15_digitos', function() {
    let value = $(this).val();
    // Eliminar cualquier caracter no numérico
    $(this).val(value.replace(/\D/g, ''));
    // Limitar a 15 dígitos
    if (value.length > 15) {
        $(this).val(value.substr(0, 15));
    }
});

$('#frmRetention').submit(function (e) {
    e.preventDefault();

    if($('#tblRetention tbody tr').length === 0){
        alert("Debe agregar al menos un detalle de retención.");
        return;
    }

    let details = [];
    let isValid = true;

    // Validar cada fila
    $('#tblRetention tbody tr').each(function () {
        let numero15digitos = $(this).find('.numero_15_digitos').val();

        // Validar que el número tenga máximo 15 dígitos
        if (numero15digitos && numero15digitos.length > 15) {
            alert("El campo 'Número' debe tener máximo 15 dígitos.");
            isValid = false;
            return false; // Salir del each
        }

        details.push({
            tax_type: $(this).find('.tax_type').val(),
            tax_code: $(this).find('.tax_code').val(),
            numero_15_digitos: numero15digitos,
            comp_pago_cuota: $(this).find('.comp_pago_cuota').val(),
            percentage: parseFloat($(this).find('.percentage').val()) || 0,
            base: parseFloat($(this).find('.base').val()) || 0,
        });
    });

    if (!isValid) {
        return;
    }

    let data = new FormData(this);
    data.append('details[]', JSON.stringify(details));

    $('#frmRetention button[type="submit"]').prop('disabled', true);

    $.ajax({
        url: '',
        type: 'POST',
        data: data,
        processData: false,
        contentType: false,
        success: function(data) {
            $('#frmRetention button[type="submit"]').prop('disabled', false);
            if(data.success){
                let html = `<p class="text-success">Retención creada correctamente!</p>
                            <a href="${data.pdf_url}" target="_blank" class="btn btn-info btn-sm">Descargar PDF</a>
                            <a href="${data.xml_url}" target="_blank" class="btn btn-warning btn-sm">Descargar XML</a>`;
                $('#downloadLinks').html(html);

                $('#tblRetention tbody').empty();
                $('input[name="subtotal"]').val('0');
            } else {
                alert("Error: " + data.error);
            }
        },
        error: function(xhr){
            $('#frmRetention button[type="submit"]').prop('disabled', false);
            alert("Error inesperado: " + xhr.responseText);
        }
    });
});
</script>

{% endblock %}
