{% extends 'base.html' %}
{% load static %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-tags"></i> {{ titulo }}
                    </h4>
                </div>
                <div class="card-body">
                    <button type="button" class="btn btn-success mb-3" onclick="nuevoTipoPago()">
                        <i class="fas fa-plus"></i> Nuevo Tipo de Pago
                    </button>

                    <div class="table-responsive">
                        <table id="tabla_tipos_pago" class="table table-bordered table-striped">
                            <thead class="thead-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Tipo Pago -->
<div class="modal fade" id="modalTipoPago" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Tipo de Pago</h5>
                <button type="button" class="close text-white" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="formTipoPago">
                    <input type="hidden" id="tipo_pago_id">
                    <div class="form-group">
                        <label>Nombre: <span class="text-danger">*</span></label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción:</label>
                        <textarea id="descripcion" class="form-control" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary" onclick="guardarTipoPago()">Guardar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        listarTiposPago();
    });

    function listarTiposPago() {
        $.ajax({
            url: window.location.pathname,
            type: 'POST',
            data: {
                'action': 'list',
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            dataType: 'json',
            success: function(response) {
                let tbody = $('#tabla_tipos_pago tbody');
                tbody.empty();

                response.forEach(function(tipo) {
                    let estado_badge = tipo.estado ?
                        '<span class="badge badge-success">Activo</span>' :
                        '<span class="badge badge-danger">Inactivo</span>';

                    let row = `
                        <tr>
                            <td>${tipo.id}</td>
                            <td>${tipo.nombre}</td>
                            <td>${tipo.descripcion || ''}</td>
                            <td>${estado_badge}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editarTipoPago(${tipo.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="eliminarTipoPago(${tipo.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.append(row);
                });
            }
        });
    }

    function nuevoTipoPago() {
        $('#formTipoPago')[0].reset();
        $('#tipo_pago_id').val('');
        $('#modalTipoPago').modal('show');
    }

    function editarTipoPago(id) {
        $.ajax({
            url: window.location.pathname,
            type: 'POST',
            data: {
                'action': 'get',
                'id': id,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            dataType: 'json',
            success: function(response) {
                $('#tipo_pago_id').val(response.id);
                $('#nombre').val(response.nombre);
                $('#descripcion').val(response.descripcion);
                $('#modalTipoPago').modal('show');
            }
        });
    }

    function guardarTipoPago() {
        if (!$('#formTipoPago')[0].checkValidity()) {
            $('#formTipoPago')[0].reportValidity();
            return;
        }

        let id = $('#tipo_pago_id').val();
        $.ajax({
            url: window.location.pathname,
            type: 'POST',
            data: {
                'action': id ? 'update' : 'create',
                'id': id,
                'nombre': $('#nombre').val(),
                'descripcion': $('#descripcion').val(),
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            dataType: 'json',
            success: function(response) {
                if (response.error) {
                    alert('Error: ' + response.error);
                } else {
                    alert(response.message);
                    $('#modalTipoPago').modal('hide');
                    listarTiposPago();
                }
            }
        });
    }

    function eliminarTipoPago(id) {
        if (!confirm('¿Está seguro de eliminar este tipo de pago?')) return;

        $.ajax({
            url: window.location.pathname,
            type: 'POST',
            data: {
                'action': 'delete',
                'id': id,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            dataType: 'json',
            success: function(response) {
                alert(response.message || response.error);
                listarTiposPago();
            }
        });
    }
</script>
{% endblock %}
