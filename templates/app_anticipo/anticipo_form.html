{% extends 'base.html' %}
{% load static %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-hand-holding-usd"></i> ANTICIPO
                    </h4>
                </div>
                <div class="card-body">
                    <form id="formAnticipo">
                        <input type="hidden" id="anticipo_id" name="anticipo_id">

                        <!-- Sección 1: Información principal -->
                        <div class="row mb-3">
                            <div class="col-md-2">
                                <label>Caja: <span class="text-danger">*</span></label>
                                <select name="caja" id="caja" class="form-control" required>
                                    <option value="PRINCIPAL">PRINCIPAL</option>
                                    <option value="SECUNDARIA">SECUNDARIA</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label>Tipo: <span class="text-danger">*</span></label>
                                <select name="tipo_cliente" id="tipo_cliente" class="form-control" required>
                                    <option value="CLIENTE">CLIENTE</option>
                                    <option value="PROVEEDOR">PROVEEDOR</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label>Centro de Costo: <span class="text-danger">*</span></label>
                                <select name="centro_costo_id" id="centro_costo_id" class="form-control" required onchange="cargarPlanCuentas()">
                                    <option value="">Seleccione empresa</option>
                                    {% for empresa in empresas %}
                                    <option value="{{ empresa.id }}">{{ empresa.siglas }} - {{ empresa.razon_social }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label>Tipo ident.: <span class="text-danger">*</span></label>
                                <select name="tipo_identificacion" id="tipo_identificacion" class="form-control" required>
                                    <option value="CEDULA">CEDULA</option>
                                    <option value="RUC">RUC</option>
                                    <option value="PASAPORTE">PASAPORTE</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label>Identificación: <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" name="identificacion" id="identificacion" class="form-control" required>
                                    <div class="input-group-append">
                                        <button type="button" class="btn btn-primary">
                                            <i class="fas fa-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Sección 2: Datos del cliente -->
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label>Razón social: <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" name="razon_social" id="razon_social" class="form-control" required>
                                    <div class="input-group-append">
                                        <button type="button" class="btn btn-primary">
                                            <i class="fas fa-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label>Nombre comercial:</label>
                                <input type="text" name="nombre_comercial" id="nombre_comercial" class="form-control">
                            </div>
                            <div class="col-md-2">
                                <label>Teléfono:</label>
                                <input type="text" name="telefono" id="telefono" class="form-control">
                            </div>
                            <div class="col-md-2">
                                <label>Celular:</label>
                                <input type="text" name="celular" id="celular" class="form-control">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label>Email:</label>
                                <input type="email" name="email" id="email" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label>Ciudad:</label>
                                <input type="text" name="ciudad" id="ciudad" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label>Dirección:</label>
                                <div class="input-group">
                                    <input type="text" name="direccion" id="direccion" class="form-control">
                                    <div class="input-group-append">
                                        <button type="button" class="btn btn-info" title="Ver/Editar dirección">
                                            <i class="fas fa-list"></i>
                                        </button>
                                        <button type="button" class="btn btn-success" title="Agregar dirección">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr>

                        <!-- Sección 3: Información del anticipo -->
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label>Fecha: <span class="text-danger">*</span></label>
                                <input type="date" name="fecha" id="fecha" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label>Monto: <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" name="monto" id="monto" class="form-control" required readonly>
                            </div>
                            <div class="col-md-6">
                                <label>Concepto: <span class="text-danger">*</span></label>
                                <input type="text" name="concepto" id="concepto" class="form-control" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label>Categoría contable:</label>
                                <select name="categoria_contable_id" id="categoria_contable_id" class="form-control">
                                    <option value="">Seleccione cuenta</option>
                                </select>
                            </div>
                        </div>

                        <!-- Sección 4: Formas de pago -->
                        <div class="card">
                            <div class="card-header bg-info text-white">
                                <h6 class="mb-0">
                                    FORMAS DE PAGO
                                    <button type="button" class="btn btn-sm btn-success float-right" onclick="abrirModalFormaPago()">
                                        <i class="fas fa-plus-circle"></i>
                                    </button>
                                </h6>
                            </div>
                            <div class="card-body">
                                <table id="tabla_formas_pago" class="table table-sm table-bordered">
                                    <thead class="thead-light">
                                        <tr>
                                            <th width="80px">Acción</th>
                                            <th>Tipo</th>
                                            <th>Forma</th>
                                            <th>Valor</th>
                                            <th>Referencia</th>
                                            <th>Banco</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbody_formas_pago">
                                    </tbody>
                                    <tfoot>
                                        <tr>
                                            <td colspan="3" class="text-right"><strong>TOTAL:</strong></td>
                                            <td><strong>$<span id="total_formas_pago">0.00</span></strong></td>
                                            <td colspan="2"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12 text-right">
                                <a href="{% url 'app_anticipos:anticipo_list' %}" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cerrar
                                </a>
                                <button type="button" class="btn btn-primary" onclick="guardarAnticipo()">
                                    <i class="fas fa-save"></i> Guardar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Forma de Pago -->
<div class="modal fade" id="modalFormaPago" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-md" role="document">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">
                    <i class="fas fa-money-bill"></i> FORMA DE PAGO
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="formFormaPago">
                    <input type="hidden" id="forma_pago_index" value="-1">

                    <div class="form-group">
                        <label>Valor: <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" id="fp_valor" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Tipo: <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <select id="fp_tipo" class="form-control" required>
                                <option value="">Seleccione...</option>
                                {% for tipo in tipos_pago %}
                                <option value="{{ tipo.id }}">{{ tipo.nombre }}</option>
                                {% endfor %}
                            </select>
                            <div class="input-group-append">
                                <a href="{% url 'app_anticipos:tipo_pago_list' %}" class="btn btn-success" title="Crear nuevo tipo" target="_blank">
                                    <i class="fas fa-plus"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Forma: <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <select id="fp_forma" class="form-control" required>
                                <option value="">Seleccione...</option>
                                {% for forma in formas_pago %}
                                <option value="{{ forma.id }}">{{ forma.nombre }}</option>
                                {% endfor %}
                            </select>
                            <div class="input-group-append">
                                <a href="{% url 'app_anticipos:forma_pago_list' %}" class="btn btn-success" title="Crear nueva forma" target="_blank">
                                    <i class="fas fa-plus"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Referencia:</label>
                        <input type="text" id="fp_referencia" class="form-control" placeholder="Número de cheque, transferencia, etc.">
                    </div>

                    <div class="form-group">
                        <label>Banco:</label>
                        <input type="text" id="fp_banco" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Observación:</label>
                        <textarea id="fp_observacion" class="form-control" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">
                    <i class="fas fa-times"></i> Cerrar
                </button>
                <button type="button" class="btn btn-primary" onclick="agregarFormaPago()">
                    <i class="fas fa-check"></i> Agregar
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block javascript %}
<script>
    let formasPagoData = [];

    $(document).ready(function() {
        // Establecer fecha actual por defecto
        let hoy = new Date().toISOString().split('T')[0];
        $('#fecha').val(hoy);

        // Cargar anticipo si viene ID en URL
        const urlParams = new URLSearchParams(window.location.search);
        const anticipoId = urlParams.get('id');
        if (anticipoId) {
            cargarAnticipo(anticipoId);
        }
    });

    function cargarAnticipo(id) {
        $.ajax({
            url: '{% url "app_anticipos:anticipo_list" %}',
            type: 'POST',
            data: {
                'action': 'get',
                'id': id,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            dataType: 'json',
            success: function(anticipo) {
                $('#anticipo_id').val(anticipo.id);
                $('#caja').val(anticipo.caja);
                $('#tipo_cliente').val(anticipo.tipo_cliente);
                $('#centro_costo_id').val(anticipo.centro_costo_id);
                $('#tipo_identificacion').val(anticipo.tipo_identificacion);
                $('#identificacion').val(anticipo.identificacion);
                $('#razon_social').val(anticipo.razon_social);
                $('#nombre_comercial').val(anticipo.nombre_comercial);
                $('#telefono').val(anticipo.telefono);
                $('#celular').val(anticipo.celular);
                $('#email').val(anticipo.email);
                $('#ciudad').val(anticipo.ciudad);
                $('#direccion').val(anticipo.direccion);
                $('#fecha').val(anticipo.fecha);
                $('#concepto').val(anticipo.concepto);

                // Cargar plan de cuentas y seleccionar
                cargarPlanCuentas(function() {
                    $('#categoria_contable_id').val(anticipo.categoria_contable_id);
                });

                // Cargar formas de pago
                formasPagoData = anticipo.formas_pago || [];
                actualizarTablaFormasPago();
            },
            error: function(xhr, status, error) {
                console.error('Error al cargar anticipo:', error);
                alert('Error al cargar el anticipo');
            }
        });
    }

    function cargarPlanCuentas(callback) {
        let empresa_id = $('#centro_costo_id').val();

        if (!empresa_id) {
            $('#categoria_contable_id').html('<option value="">Seleccione cuenta</option>');
            return;
        }

        $.ajax({
            url: '{% url "app_anticipos:anticipo_list" %}',
            type: 'POST',
            data: {
                'action': 'get_plan_cuentas',
                'empresa_id': empresa_id,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            dataType: 'json',
            success: function(response) {
                let select = $('#categoria_contable_id');
                select.html('<option value="">Seleccione cuenta</option>');

                response.forEach(function(cuenta) {
                    select.append(`<option value="${cuenta.id}">${cuenta.descripcion}</option>`);
                });

                if (callback) callback();
            },
            error: function(xhr, status, error) {
                console.error('Error al cargar plan de cuentas:', error);
                alert('Error al cargar el plan de cuentas. Por favor intente nuevamente.');
            }
        });
    }

    function abrirModalFormaPago() {
        $('#formFormaPago')[0].reset();
        $('#forma_pago_index').val(-1);
        $('#modalFormaPago').modal('show');
    }

    function agregarFormaPago() {
        // Validar formulario
        if (!$('#formFormaPago')[0].checkValidity()) {
            $('#formFormaPago')[0].reportValidity();
            return;
        }

        let valor = parseFloat($('#fp_valor').val());
        let tipo_id = $('#fp_tipo').val();
        let forma_id = $('#fp_forma').val();
        let referencia = $('#fp_referencia').val();
        let banco = $('#fp_banco').val();
        let observacion = $('#fp_observacion').val();

        if (!valor || valor <= 0) {
            alert('Ingrese un valor válido');
            return;
        }

        if (!tipo_id || !forma_id) {
            alert('Seleccione tipo y forma de pago');
            return;
        }

        let tipo_nombre = $('#fp_tipo option:selected').text();
        let forma_nombre = $('#fp_forma option:selected').text();

        let formaPago = {
            tipo_id: tipo_id,
            tipo_nombre: tipo_nombre,
            forma_id: forma_id,
            forma_nombre: forma_nombre,
            valor: valor,
            referencia: referencia,
            banco: banco,
            observacion: observacion
        };

        let index = parseInt($('#forma_pago_index').val());
        if (index >= 0) {
            formasPagoData[index] = formaPago;
        } else {
            formasPagoData.push(formaPago);
        }

        actualizarTablaFormasPago();
        $('#modalFormaPago').modal('hide');
    }

    function actualizarTablaFormasPago() {
        let tbody = $('#tbody_formas_pago');
        tbody.empty();

        let total = 0;

        formasPagoData.forEach(function(fp, index) {
            total += parseFloat(fp.valor);

            let row = `
                <tr>
                    <td>
                        <button type="button" class="btn btn-sm btn-danger" onclick="eliminarFormaPago(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button type="button" class="btn btn-sm btn-warning" onclick="editarFormaPago(${index})">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                    <td>${fp.tipo_nombre}</td>
                    <td>${fp.forma_nombre}</td>
                    <td>${fp.valor.toFixed(2)}</td>
                    <td>${fp.referencia || ''}</td>
                    <td>${fp.banco || ''}</td>
                </tr>
            `;
            tbody.append(row);
        });

        $('#total_formas_pago').text(total.toFixed(2));
        $('#monto').val(total.toFixed(2));
    }

    function editarFormaPago(index) {
        let fp = formasPagoData[index];

        $('#forma_pago_index').val(index);
        $('#fp_valor').val(fp.valor);
        $('#fp_tipo').val(fp.tipo_id);
        $('#fp_forma').val(fp.forma_id);
        $('#fp_referencia').val(fp.referencia);
        $('#fp_banco').val(fp.banco);
        $('#fp_observacion').val(fp.observacion);

        $('#modalFormaPago').modal('show');
    }

    function eliminarFormaPago(index) {
        if (!confirm('¿Está seguro de eliminar esta forma de pago?')) return;

        formasPagoData.splice(index, 1);
        actualizarTablaFormasPago();
    }

    function guardarAnticipo() {
        // Validar formulario principal
        if (!$('#formAnticipo')[0].checkValidity()) {
            $('#formAnticipo')[0].reportValidity();
            return;
        }

        // Validar que haya al menos una forma de pago
        if (formasPagoData.length === 0) {
            alert('Debe agregar al menos una forma de pago');
            return;
        }

        // Validar que el total de formas de pago coincida con el monto
        let total_formas = parseFloat($('#total_formas_pago').text());
        let monto = parseFloat($('#monto').val());

        if (Math.abs(total_formas - monto) > 0.01) {
            alert('El total de formas de pago no coincide con el monto');
            return;
        }

        // Preparar datos
        let anticipo_id = $('#anticipo_id').val();
        let action = anticipo_id ? 'update' : 'create';

        let formData = {
            'action': action,
            'caja': $('#caja').val(),
            'tipo_cliente': $('#tipo_cliente').val(),
            'centro_costo_id': $('#centro_costo_id').val(),
            'tipo_identificacion': $('#tipo_identificacion').val(),
            'identificacion': $('#identificacion').val(),
            'razon_social': $('#razon_social').val(),
            'nombre_comercial': $('#nombre_comercial').val(),
            'telefono': $('#telefono').val(),
            'celular': $('#celular').val(),
            'email': $('#email').val(),
            'ciudad': $('#ciudad').val(),
            'direccion': $('#direccion').val(),
            'fecha': $('#fecha').val(),
            'monto': $('#monto').val(),
            'concepto': $('#concepto').val(),
            'categoria_contable_id': $('#categoria_contable_id').val(),
            'formas_pago': JSON.stringify(formasPagoData),
            'csrfmiddlewaretoken': '{{ csrf_token }}'
        };

        if (anticipo_id) {
            formData.id = anticipo_id;
        }

        // Enviar datos
        $.ajax({
            url: '{% url "app_anticipos:anticipo_list" %}',
            type: 'POST',
            data: formData,
            dataType: 'json',
            beforeSend: function() {
                // Deshabilitar botón para evitar doble clic
                $('button[onclick="guardarAnticipo()"]').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Guardando...');
            },
            success: function(response) {
                if (response.error) {
                    alert('Error: ' + response.error);
                } else {
                    alert(response.message || 'Anticipo guardado exitosamente');
                    window.location.href = '{% url "app_anticipos:anticipo_list" %}';
                }
            },
            error: function(xhr, status, error) {
                console.error('Error al guardar anticipo:', error);
                alert('Error al guardar el anticipo. Por favor intente nuevamente.');
            },
            complete: function() {
                $('button[onclick="guardarAnticipo()"]').prop('disabled', false).html('<i class="fas fa-save"></i> Guardar');
            }
        });
    }
</script>
{% endblock %}
