{% extends 'base.html' %}

{% load widget_tweaks %}

{% block contenido %}

<form method="post">

    {% csrf_token %}

    <div class="card">

        <div class="card-header bg-warning">

            <h3>

                Editar Transferencia

            </h3>

        </div>

        <div class="card-body">

            {% for field in form %}

                <div class="form-group">

                    <label>

                        {{ field.label }}

                    </label>

                    {{ field|add_class:"form-control" }}

                </div>

            {% endfor %}

        </div>

        <div class="card-footer">

            <button type="submit"
                    class="btn btn-success">

                Guardar

            </button>

        </div>

    </div>

</form>

{% endblock %}
